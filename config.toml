baseURL = "https://blog.ebemunk.com/"
title = "Thinking Through the Party"
theme = "lexo"
locale = "en-US"

pygmentscodefences = true

googleAnalytics = "G-HYX1G0GTVT"
disqusShortname = "ebemunk"

disableKinds = ["taxonomy", "section"]
ignoreErrors = ["error-disable-taxonomy"]

[pagination]
  pagerSize = 20

# Hugo 0.158+ denies content/*.html by default; a few posts ship HTML siblings.
[security]
  allowContent = ['(?i)text/(markdown|html|asciidoc|rst|org|pandoc)']

[params]
  author = "ebemunk"
  description = "Long-form data visualization essays by ebemunk: chess, books, Playboy, plane crashes, and whatever else gets stuck in my head."

[taxonomies]
  tag = "tags"

[permalinks]
  post = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true

# Keep comments: React SSR output relies on its empty <!-- --> text separators to hydrate.
[minify.tdewolff.html]
  keepComments = true
