<!DOCTYPE html>
<!-- Source for assets/img/default.png, the share image for pages without their own `image`.
     Regenerate (from the repo root):
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
       --window-size=1200,800 --screenshot=assets/img/default.png themes/lexo/og-image/default.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Marcellus SC"; src: url(../static/fonts/marcellus-sc-400-latin.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 300; src: url(../static/fonts/poppins-300-latin.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; background: #282c34; }
  .art {
    position: absolute; inset: 0;
    background: url(../static/img/wildpianoparty.png) center / cover no-repeat;
  }
  .band {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    background: rgba(40, 44, 52, 0.88);
    border-top: 6px solid black; border-bottom: 6px solid black;
    padding: 44px 0 40px; text-align: center;
  }
  h1 { margin: 0; font: 400 80px/1 "Marcellus SC", serif; color: #c13422; }
  p { margin: 18px 0 0; font: 300 30px/1.2 "Poppins", sans-serif; color: #fff; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="art"></div>
  <div class="band">
    <h1>Thinking Through the Party</h1>
    <p>long-form data visualization by ebemunk</p>
  </div>
</body>
</html>
